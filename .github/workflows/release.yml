name: Release

# Required secrets: none for unsigned CI artifacts.
# Optional future signing secrets for Tauri updater/distribution can be added as:
# - TAURI_SIGNING_PRIVATE_KEY
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# This workflow uploads build artifacts only after validation and platform builds pass.
# It does not publish a GitHub Release automatically.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:prepare

      - name: Lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: Rust cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  build-tauri:
    name: Build Tauri app (${{ matrix.platform.name }})
    needs: validate
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:prepare

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Upload unsigned desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: socketlens-${{ matrix.platform.name }}-${{ github.ref_name }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
