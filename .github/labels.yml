# Recommended GitHub labels for SocketLens.
# This file is documentation for maintainers; GitHub does not apply it automatically.

- name: "type: bug"
  color: "d73a4a"
  description: "Something reproducible is broken."
- name: "type: enhancement"
  color: "a2eeef"
  description: "Improves existing alpha behavior without changing project scope."
- name: "type: documentation"
  color: "0075ca"
  description: "README, docs, examples, release notes, or contributor guidance."
- name: "type: test"
  color: "5319e7"
  description: "Automated, manual, or release QA coverage."
- name: "type: maintenance"
  color: "cfd3d7"
  description: "Build, CI, dependencies, scripts, cleanup, or repository hygiene."
- name: "type: security"
  color: "b60205"
  description: "Security, privacy, local files, secrets, logs, or data-flow concern."

- name: "area: onboarding"
  color: "1d76db"
  description: "First-run flow and quick-start understanding."
- name: "area: demo"
  color: "1d76db"
  description: "Investor Demo Mode or synthetic demo stream."
- name: "area: direct-mode"
  color: "1d76db"
  description: "Direct WebSocket connection mode."
- name: "area: proxy-mode"
  color: "1d76db"
  description: "Native Rust/Tauri proxy mode."
- name: "area: replay"
  color: "1d76db"
  description: "Manual send and replay workflow."
- name: "area: timeline"
  color: "1d76db"
  description: "Packet timeline, filtering, search, and high-volume behavior."
- name: "area: inspector"
  color: "1d76db"
  description: "Payload inspector, pretty/raw/metadata views, copy behavior."
- name: "area: sessions"
  color: "1d76db"
  description: "Session save/load, import/export, and schema validation."
- name: "area: settings"
  color: "1d76db"
  description: "Settings persistence, privacy controls, memory limits, and theme."
- name: "area: i18n"
  color: "1d76db"
  description: "Russian and English UI localization."
- name: "area: ai"
  color: "1d76db"
  description: "Optional AI provider configuration and explain actions."
- name: "area: rust"
  color: "1d76db"
  description: "Tauri backend, Rust commands, proxy lifecycle, native checks."
- name: "area: docs"
  color: "1d76db"
  description: "Documentation and open-source onboarding."
- name: "area: release"
  color: "1d76db"
  description: "CI, release workflow, assets, installers, and versioning."

- name: "status: needs-triage"
  color: "fbca04"
  description: "Needs maintainer review before implementation."
- name: "status: needs-repro"
  color: "fbca04"
  description: "Needs a minimal reproduction or clearer steps."
- name: "status: blocked"
  color: "bfdadc"
  description: "Blocked by an environment, dependency, or design decision."
- name: "status: accepted"
  color: "0e8a16"
  description: "Accepted for implementation."
- name: "status: help-wanted"
  color: "0e8a16"
  description: "A contributor can pick this up with maintainer guidance."

- name: "good first issue"
  color: "7057ff"
  description: "Small, clear, and testable for first-time contributors."
- name: "difficulty: small"
  color: "c5def5"
  description: "Small focused patch."
- name: "difficulty: medium"
  color: "c5def5"
  description: "Moderate scope or multiple files."
- name: "difficulty: large"
  color: "c5def5"
  description: "Needs design discussion or careful coordination."

- name: "priority: release-blocker"
  color: "b60205"
  description: "Must be fixed before a public release."
- name: "priority: high"
  color: "d93f0b"
  description: "Important for alpha trust, stability, or onboarding."
- name: "priority: normal"
  color: "fbca04"
  description: "Useful but not blocking."
- name: "priority: low"
  color: "cfd3d7"
  description: "Nice-to-have or can wait."
