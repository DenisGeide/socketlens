[package]
name = "socketlens"
version = "1.0.0-alpha"
description = "A professional desktop WebSocket debugger for developers building realtime apps."
authors = ["SocketLens contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
homepage = "https://github.com/DenisGeide/socketlens"
repository = "https://github.com/DenisGeide/socketlens"

[lib]
name = "socketlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
